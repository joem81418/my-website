<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCP Staff Console — Order Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070D; --bg-alt:#0A0F1E; --panel:#0F1630; --panel-2:#151E42;
  --line:rgba(255,255,255,0.09); --text:#F2F5FF; --text-dim:#8C98BE;
  --blue:#2F6FED; --blue-bright:#5FA0FF; --blue-deep:#14245C;
  --green:#2ECC71; --amber:#F2B33D; --red:#FF5C5C;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
h1,h2,.display{font-family:'Poppins',sans-serif;font-weight:800;letter-spacing:-0.01em;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;cursor:pointer;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 26px;border-bottom:1px solid var(--line);background:rgba(10,15,30,0.7);position:sticky;top:0;z-index:10;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-badge{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--blue-deep));display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Poppins';font-size:13px;color:white;}
.brand-titles .name{font-size:16px;font-weight:800;font-family:'Poppins';}
.brand-titles .sub{font-family:'JetBrains Mono';font-size:10px;color:var(--text-dim);}
.clock{font-family:'JetBrains Mono';font-size:13px;color:var(--text-dim);}

.board{max-width:1400px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;}
.col{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:260px;}
.col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line);}
.col-head h2{font-size:15px;margin:0;}
.count-badge{font-family:'JetBrains Mono';font-size:12px;background:var(--panel-2);border-radius:999px;padding:3px 10px;color:var(--text-dim);}
.col.new .count-badge{color:var(--amber);}
.col.preparing .count-badge{color:var(--blue-bright);}
.col.ready .count-badge{color:var(--green);}

.ocard{background:var(--panel-2);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:12px;}
.ocard .ohead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.ocard .ticket{font-family:'JetBrains Mono';font-weight:700;font-size:19px;color:var(--blue-bright);}
.ocard .time{font-family:'JetBrains Mono';font-size:10.5px;color:var(--text-dim);}
.ocard .cust{font-size:12.5px;color:var(--text-dim);margin-bottom:8px;}
.ocard .items{font-size:12.5px;margin-bottom:10px;line-height:1.6;}
.ocard .items div{display:flex;justify-content:space-between;}
.ocard .pay{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:'JetBrains Mono';padding:4px 9px;border-radius:999px;background:var(--bg-alt);color:var(--text-dim);margin-bottom:10px;}
.ocard .pay.verified{color:var(--green);}
.ocard .actions{display:flex;gap:8px;flex-wrap:wrap;}
.bt{border:none;border-radius:9px;padding:9px 13px;font-weight:700;font-size:12.5px;font-family:'Inter';}
.bt-primary{background:var(--blue);color:white;}
.bt-ready{background:var(--green);color:#06210F;}
.bt-done{background:var(--panel);border:1.5px solid var(--line);color:var(--text);}
.bt-cancel{background:transparent;border:1.5px solid var(--red);color:var(--red);}
.empty-col{color:var(--text-dim);font-size:12.5px;text-align:center;padding:30px 10px;font-family:'JetBrains Mono';}

@media(max-width:1000px){ .board{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-badge">SCP</div>
    <div class="brand-titles">
      <div class="name">Staff Console — Order Queue</div>
      <div class="sub">SCP Canteen Supply Chain Process</div>
    </div>
  </div>
  <div class="clock mono" id="clock">--:--:--</div>
</div>

<div class="board" id="board">
  <div class="col new">
    <div class="col-head"><h2>🆕 New Orders</h2><span class="count-badge" id="cNew">0</span></div>
    <div id="colNew"></div>
  </div>
  <div class="col preparing">
    <div class="col-head"><h2>👨‍🍳 Preparing</h2><span class="count-badge" id="cPrep">0</span></div>
    <div id="colPrep"></div>
  </div>
  <div class="col ready">
    <div class="col-head"><h2>🔔 Ready for Pick-up</h2><span class="count-badge" id="cReady">0</span></div>
    <div id="colReady"></div>
  </div>
</div>

<script>
const KEYS = { orders:'scp_orders', menu:'scp_menu', settings:'scp_settings' };

const HAS_ARTIFACT_STORAGE = typeof window.storage !== 'undefined'
  && window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function';

async function kvGet(key){
  if(HAS_ARTIFACT_STORAGE){
    try{ const r = await window.storage.get(key, true); return r ? r.value : null; }catch(e){ /* fall through */ }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function kvSet(key, value){
  if(HAS_ARTIFACT_STORAGE){
    try{ await window.storage.set(key, value, true); return; }catch(e){ console.error(e); }
  }
  try{ localStorage.setItem(key, value); }catch(e){ console.error(e); }
}

async function loadOrders(){
  const v = await kvGet(KEYS.orders);
  try{ return v ? JSON.parse(v) : []; }catch(e){ return []; }
}
async function saveOrders(orders){
  await kvSet(KEYS.orders, JSON.stringify(orders));
}

window.addEventListener('storage', (e)=>{
  if(e.key === KEYS.orders) render();
});

function escapeHtml(str){ return String(str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function timeAgo(ts){
  const mins = Math.max(0, Math.floor((Date.now()-ts)/60000));
  if(mins<1) return 'just now';
  if(mins===1) return '1 min ago';
  return mins+' min ago';
}

function orderCard(o, actionsHtml){
  const itemsHtml = o.items.map(it=>`<div><span>${it.qty}× ${escapeHtml(it.name)}</span><span class="mono">₱${it.price*it.qty}</span></div>`).join('');
  return `
  <div class="ocard">
    <div class="ohead"><span class="ticket">${o.ticket}</span><span class="time">${timeAgo(o.createdAt)}</span></div>
    <div class="cust">${escapeHtml(o.name)} ${o.section ? '· '+escapeHtml(o.section):''}</div>
    <div class="items">${itemsHtml}</div>
    <div class="pay">💳 Cash on pick-up</div>
    <div class="actions">${actionsHtml}</div>
  </div>`;
}

async function render(){
  const orders = await loadOrders();
  const news = orders.filter(o=>o.status==='placed').sort((a,b)=>a.createdAt-b.createdAt);
  const preps = orders.filter(o=>o.status==='preparing').sort((a,b)=>a.createdAt-b.createdAt);
  const readys = orders.filter(o=>o.status==='ready').sort((a,b)=>a.createdAt-b.createdAt);

  document.getElementById('cNew').textContent = news.length;
  document.getElementById('cPrep').textContent = preps.length;
  document.getElementById('cReady').textContent = readys.length;

  document.getElementById('colNew').innerHTML = news.length ? news.map(o=>orderCard(o, `
      <button class="bt bt-primary" onclick="advance('${o.id}','preparing')">Accept & Prepare</button>
      <button class="bt bt-cancel" onclick="cancelOrder('${o.id}')">Cancel</button>
    `)).join('') : `<div class="empty-col">No new orders.</div>`;

  document.getElementById('colPrep').innerHTML = preps.length ? preps.map(o=>orderCard(o, `
      <button class="bt bt-ready" onclick="advance('${o.id}','ready')">Mark Ready</button>
      <button class="bt bt-cancel" onclick="cancelOrder('${o.id}')">Cancel</button>
    `)).join('') : `<div class="empty-col">Nothing being prepared.</div>`;

  document.getElementById('colReady').innerHTML = readys.length ? readys.map(o=>orderCard(o, `
      <button class="bt bt-done" onclick="advance('${o.id}','completed')">Mark Picked Up</button>
    `)).join('') : `<div class="empty-col">No orders ready.</div>`;
}

async function advance(id, status){
  const orders = await loadOrders();
  const idx = orders.findIndex(o=>o.id===id);
  if(idx===-1) return;
  orders[idx].status = status;
  await saveOrders(orders);
  render();
}
async function cancelOrder(id){
  if(!confirm('Cancel this order?')) return;
  const orders = await loadOrders();
  const idx = orders.findIndex(o=>o.id===id);
  if(idx===-1) return;
  orders[idx].status = 'cancelled';
  await saveOrders(orders);
  render();
}

function tickClock(){
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-PH', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
tickClock();
setInterval(tickClock, 1000);

render();
setInterval(render, 2000);
</script>
</body>
</html>
